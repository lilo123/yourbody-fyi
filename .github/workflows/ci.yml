name: CI

on:
  push:
    branches:
      - main
      - v2-rewrite
      - master
  pull_request:
    branches:
      - main
      - v2-rewrite
      - master

env:
  VITE_SUPABASE_URL: http://127.0.0.1:58821
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

jobs:
  static-unit:
    name: Static Analysis, Unit, Timezone, pgTAP & Deno Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      # --force, not plain `tsc -b`: the incremental cache treats already-clean .test.tsx
      # files as up to date and has hidden real errors here before (four missing
      # `beforeEach` imports shipped a red run). Fresh CI checkouts have no .tsbuildinfo
      # today, so this is belt-and-braces -- but it makes the guarantee explicit.
      - name: TypeScript typecheck
        run: npx tsc -b --force

      - name: Build application
        run: npm run build

      - name: Verify performance budget
        run: npm run perf:budget

      - name: Verify mock fidelity
        run: npm run check:mocks

      - name: Verify payload projections
        run: npm run check:payload

      - name: Verify design ratchet
        run: npm run check:design

      - name: Verify brand guard
        run: npm run check:brand

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # `supabase start` pulls its service images from ghcr.io. Anonymous pulls share a
      # global rate-limit bucket that, when saturated, fails every image with
      # "toomanyrequests" and takes the whole job down before a single test runs.
      # Authenticating with the built-in GITHUB_TOKEN moves these pulls onto the
      # per-user limit. No secret needs to be configured; GITHUB_TOKEN is automatic.
      - name: Authenticate to ghcr.io for Supabase image pulls
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only four services are actually exercised by the suite: postgres, kong (the API
      # gateway VITE_SUPABASE_URL points at), postgrest and gotrue. Excluding the rest
      # cuts the images pulled from 11 to 4, which both speeds the job up and shrinks the
      # surface exposed to registry rate limiting.
      - name: Start Supabase local emulator
        run: |
          set -u
          EXCLUDE="studio,realtime,storage-api,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor"
          for attempt in 1 2 3; do
            if npx supabase start -x "$EXCLUDE"; then
              echo "supabase start succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt/3"
            if [ "$attempt" -lt 3 ]; then
              npx supabase stop || true
              sleep $((attempt * 30))
            fi
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Reset database and seed
        run: npx supabase db reset

      - name: Seed performance benchmark data
        run: npm run seed:stress

      # After Supabase is up: ghostSets.test.ts includes a DB-backed fidelity check (127.0.0.1:58822).
      - name: Run date-sensitive timezone tests (H19)
        run: npm run test:tz

      - name: Run vitest unit tests
        run: npm run test

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Run Deno edge function tests
        run: npm run test:deno

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e-desktop-chrome:
    name: E2E - Desktop Chrome & Performance Tracing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Authenticate to ghcr.io for Supabase image pulls
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase local emulator
        run: |
          set -u
          EXCLUDE="studio,realtime,storage-api,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor"
          for attempt in 1 2 3; do
            if npx supabase start -x "$EXCLUDE"; then
              echo "supabase start succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt/3"
            if [ "$attempt" -lt 3 ]; then
              npx supabase stop || true
              sleep $((attempt * 30))
            fi
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Reset database and seed
        run: npx supabase db reset

      - name: Seed performance benchmark data
        run: npm run seed:stress

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Desktop Chrome)
        run: npx playwright test tests/e2e --project='Desktop Chrome' --workers=1

      - name: Run PWA production service-worker E2E tests
        run: npx playwright test -c playwright.pwa.config.ts

      # Non-blocking: /workout payload currently measures ~182-194 KB vs the 153,600 B ceiling.
      # The ceiling must not be relaxed to make it pass. The breach remains visible in CI output.
      - name: Run performance trace (non-blocking, /workout payload currently above the 150 KB budget)
        continue-on-error: true
        run: npm run perf:trace

      - name: Verify performance artifact (non-blocking, /workout payload currently above the 150 KB budget)
        continue-on-error: true
        run: npm run perf:verify

