  density:
    name: Visual Density Gate (320px Roboto)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The app uses the system font stack (-apple-system, ..., Roboto, Helvetica, Arial). Local
      # Linux and Android resolve it to Roboto; ubuntu-latest has no Roboto and falls back to a
      # wider sans, which shifts the px-exact density measurements. Match the local renderer.
      - name: Install Roboto for the density gate
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto && fc-cache -f && fc-match Roboto

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Authenticate to ghcr.io for Supabase image pulls
        uses: docker/login-action@v4
