name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull Supabase service images (including pg_prove for pgTAP) from the ghcr.io mirror,
  # authenticated in .github/actions/setup-supabase, instead of rate-limited public.ecr.aws.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
  VITE_SUPABASE_URL: http://127.0.0.1:58821
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

jobs:
  static:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      # --force, not plain `tsc -b`: the incremental cache treats already-clean .test.tsx
      # files as up to date and has hidden real errors here before (four missing
      # `beforeEach` imports shipped a red run). Fresh CI checkouts have no .tsbuildinfo
      # today, so this is belt-and-braces -- but it makes the guarantee explicit.
      - name: TypeScript typecheck
        run: npx tsc -b --force

      - name: Build application
        run: npm run build

      - name: Verify performance budget
        run: npm run perf:budget

      - name: Verify mock fidelity
        run: npm run check:mocks

      - name: Verify payload projections
        run: npm run check:payload

      - name: Verify design ratchet
        run: npm run check:design

      - name: Verify brand guard
        run: npm run check:brand

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit Tests (${{ matrix.tz }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - America/Los_Angeles
          - Asia/Tokyo

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ghostSets.test.ts includes a DB-backed fidelity check against local Postgres (127.0.0.1:58822)
      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vitest unit tests
        run: npm test

  db:
    name: Database & Deno Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Install dependencies
        run: npm ci

      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Run Deno edge function tests
        run: npm run test:deno

  e2e-desktop-chrome:
    name: E2E - Desktop Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Desktop Chrome)
        run: npx playwright test tests/e2e --project='Desktop Chrome' --workers=1

      - name: Run PWA production service-worker E2E tests
        run: npx playwright test -c playwright.pwa.config.ts

      # Non-blocking: /workout payload currently measures ~182-194 KB vs the 153,600 B ceiling.
      # The ceiling must not be relaxed to make it pass. The breach remains visible in CI output.
      - name: Run performance trace (non-blocking, /workout payload currently above the 150 KB budget)
        continue-on-error: true
        run: npm run perf:trace

      - name: Verify performance artifact (non-blocking, /workout payload currently above the 150 KB budget)
        continue-on-error: true
        run: npm run perf:verify

  e2e-mobile-safari:
    name: E2E - Mobile Safari
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser (WebKit)
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests (Mobile Safari)
        run: npx playwright test tests/e2e --project='Mobile Safari' --workers=1

  e2e-narrow-safari:
    name: E2E - Narrow Safari
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser (WebKit)
        run: npx playwright install --with-deps webkit

      - name: Run E2E tests (Narrow Safari 320px)
        run: npx playwright test tests/e2e --project='Narrow Safari (320px)' --workers=1

  density:
    name: Visual Density
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version 22)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The app uses the system font stack (-apple-system, ..., Roboto, Helvetica, Arial). Local
      # Linux and Android resolve it to Roboto; ubuntu runner has no Roboto and falls back to a
      # wider sans, which shifts the px-exact density measurements. Match the local renderer.
      - name: Install Roboto for the density gate
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto && fc-cache -f && fc-match Roboto

      - name: Setup and start Supabase
        uses: ./.github/actions/setup-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run visual density gate
        run: npm run test:density
